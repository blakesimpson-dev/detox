# shellcheck shell=bash disable=SC2034
# Sourced by detox.sh.

RED='\033[0;31m'
GREEN='\033[0;32m'
YELLOW='\033[0;33m'
BLUE='\033[0;34m'
CYAN='\033[0;36m'
RESET='\033[0m'

# Perl runs in byte mode, so non-ASCII text and invalid bytes pass through
# untouched. Control characters, keeping tab, newline and carriage return:
PERL_BINARY_REGEX='s/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]//g'
# UTF-8 bytes of zero-width space, non-joiner, joiner and the byte-order mark:
PERL_ZWC_REGEX='s/\xE2\x80[\x8B-\x8D]|\xEF\xBB\xBF//g'
